version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      dev-deps:
        dependency-type: development
      prod-deps:
        dependency-type: production
    ignore:
      - dependency-name: "@babel/preset-env"
        update-types: ["version-update:semver-major"]
